# Wallpaper Glass — neutral overlay with strong wallpaper visibility.
# MangoWM provides background blur; Foot only provides transparency.
[main]
font=Noto Sans Mono:size=15,Symbols Nerd Font Mono:size=15
pad=14x12
dpi-aware=yes
resize-delay-ms=100
bold-text-in-bright=no

[scrollback]
lines=5000
multiplier=3.0

[cursor]
style=block
blink=no

[colors]
# 0 = transparent; 1 = opaque. 0.58 keeps text readable on most wallpapers.
alpha=0.58
foreground=f2f0eb
background=171717
selection-foreground=f9f8f6
selection-background=53504b
urls=d5d0c6

regular0=252525
regular1=b98a89
regular2=9fae92
regular3=c4b597
regular4=a6adb3
regular5=b5a6b4
regular6=9cb6ac
regular7=e2ded7

bright0=797774
bright1=d0a09c
bright2=b7c5a9
bright3=ddd0b4
bright4=c2c7cb
bright5=d0c1ce
bright6=b9d2c9
bright7=fffdf8

[csd]
preferred=server
