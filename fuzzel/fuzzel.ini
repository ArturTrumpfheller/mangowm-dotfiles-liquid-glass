# Wallpaper Glass — RRGGBBAA; AA = opacity in hexadecimal.
[main]
font=Noto Sans Mono:size=14
terminal=foot -e
prompt="run: "
placeholder=application
icons-enabled=yes
icon-theme=Adwaita
show-actions=no
match-mode=fzf
sort-result=yes
anchor=center
layer=overlay
keyboard-focus=exclusive
width=44
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=12
line-height=28

[colors]
background=17171796
text=f1efebff
prompt=e4e0d7ff
placeholder=b9b5aeff
input=fffdf8ff
match=e7e2d9ff
selection=ddd8cd25
selection-text=fffdf8ff
selection-match=fffdf8ff
counter=c3c0baff
border=f4f1eb59

[border]
width=1
radius=16
selection-radius=9
